name: Build A32 Surgical Kernel
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel
        uses: actions/checkout@v4
        with:
          repository: Yenping0001/android_kernel_samsung_a326b
          ref: a32x-kernel
          fetch-depth: 1

      - name: Install Build Tools
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential flex git libssl-dev libncurses5-dev python3 zip patch

      - name: Setup KernelSU-Next (Legacy)
        run: |
          # 1. Pull KSU-Next Legacy
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s legacy
          
          # 2. Rename directory to match what SUSFS patches expect
          mv KernelSU-Next KernelSU
          
          # 3. Disable KPROBES (Non-GKI requirement)
          find KernelSU -type f -exec sed -i 's/#ifdef CONFIG_KPROBES/#if defined(CONFIG_KPROBES) \&\& 0/g' {} +

      - name: Apply SUSFS Kernel Patches (FS Layer)
        run: |
          git clone -b kernel-4.14 https://gitlab.com/simonpunk/susfs4ksu.git susfs_src
          cp susfs_src/kernel_patches/fs/susfs.c fs/
          cp susfs_src/kernel_patches/include/linux/susfs.h include/linux/
          
          # We ONLY patch the kernel files (fs/, include/, etc.) 
          # We skip the failing 'kernel/Makefile' and 'selinux' hunks to prevent errors
          patch -p1 --fuzz=3 < susfs_src/kernel_patches/50_add_susfs_in_kernel-4.14.patch || true

      - name: Bridge KSU-Next and SUSFS (Manual Injection)
        run: |
          # Instead of the broken patch, we manually inject SUSFS support into KSU-Next
          KSU_CORE="KernelSU/kernel/ksu.c"
          
          # Add the header
          sed -i '1i #include <linux/susfs.h>' $KSU_CORE
          
          # Inject SUSFS call into the KSU commit function
          # This allows SUSFS to 'clean up' after KSU makes changes
          sed -i '/ksu_handle_commit/a \    susfs_set_fa_ksu_status(true);' $KSU_CORE

      - name: Kill Security & Enable KVM / Hypervisor
        run: |
          CONF="arch/arm64/configs/rufnx_defconfig"
          
          # --- Disable Samsung Security "Idiots" ---
          # We use a broad sweep to make sure nothing stays 'y'
          sed -i 's/CONFIG_SECURITY_DEFEX=y/CONFIG_SECURITY_DEFEX=n/g' $CONF
          sed -i 's/CONFIG_SECURITY_SAMSUNG_RKP=y/CONFIG_SECURITY_SAMSUNG_RKP=n/g' $CONF
          sed -i 's/CONFIG_KNOX_KAP=y/CONFIG_KNOX_KAP=n/g' $CONF
          sed -i 's/CONFIG_SEC_RESTRICT_SETUID=y/CONFIG_SEC_RESTRICT_SETUID=n/g' $CONF
          
          # --- Enable KVM (Virtualization) ---
          # Research check: MT6833/Dimensity 700 supports EL2
          echo "CONFIG_VIRTUALIZATION=y" >> $CONF
          echo "CONFIG_KVM=y" >> $CONF
          echo "CONFIG_KVM_ARM_HOST=y" >> $CONF
          echo "CONFIG_KVM_ARM_PMU=y" >> $CONF
          echo "CONFIG_HAVE_KVM=y" >> $CONF
          
          # --- Enable KSU-Next & SUSFS ---
          echo "CONFIG_KSU=y" >> $CONF
          echo "CONFIG_KSU_NEXT=y" >> $CONF
          echo "CONFIG_KSU_SUSFS=y" >> $CONF
          echo "CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y" >> $CONF
          
          # Fix the Makefile manually (the patch failed this)
          echo "obj-y += fs/susfs.o" >> fs/Makefile

      - name: Build Kernel
        run: |
          chmod +x build_kernel.sh
          ./build_kernel.sh
        env:
          KBUILD_BUILD_USER: "Frost"
          KBUILD_BUILD_HOST: "Stealth-Box"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: A32-Surgical-KSU-Next
          path: output/*.zip
