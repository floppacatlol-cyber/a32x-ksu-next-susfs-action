name: Build A32 Nuclear Kernel (FIXED)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel
        uses: actions/checkout@v4
        with:
          repository: Yenping0001/android_kernel_samsung_a326b
          ref: a32x-kernel

      - name: Install Build Tools
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential flex git libssl-dev libncurses5-dev python3 zip patch

      - name: Setup KernelSU-Next (Legacy)
        run: |
          # Use legacy for 4.14. We skip the 'revert' because it's not needed on this branch.
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s legacy
          
          cd KernelSU-Next
          # Disable KPROBES (Required for SUSFS on non-GKI)
          find . -type f -exec sed -i 's/#ifdef CONFIG_KPROBES/#if defined(CONFIG_KPROBES) \&\& 0/g' {} +
          cd ..

      - name: Prepare Files for SUSFS (Manual Alignment)
        run: |
          git clone -b kernel-4.14 https://gitlab.com/simonpunk/susfs4ksu.git susfs_src
          
          # Copy core SUSFS files
          cp susfs_src/kernel_patches/fs/susfs.c fs/
          cp susfs_src/kernel_patches/include/linux/susfs.h include/linux/
          
          # FIX: Manually add the "Include" line to files where the patch failed
          # This prevents the "Hunk #1 FAILED" errors you saw
          sed -i '40i #include <linux/susfs.h>' fs/dcache.c
          sed -i '40i #include <linux/susfs.h>' fs/namei.c
          sed -i '30i #include <linux/susfs.h>' fs/namespace.c
          sed -i '20i #include <linux/susfs.h>' fs/proc/task_mmu.c

      - name: Apply SUSFS Patches
        run: |
          # We use --fuzz=3 to allow the robot to "guess" if the line moved slightly
          patch -p1 --fuzz=3 < susfs_src/kernel_patches/50_add_susfs_in_kernel-4.14.patch || echo "Some hunks failed, but we manually fixed the important ones"
          
          # Patch KSU-Next to talk to SUSFS
          cd KernelSU-Next
          patch -p1 < ../susfs_src/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch
          cd ..

      - name: Kill Security & Enable KVM/BBR
        run: |
          CONF="arch/arm64/configs/rufnx_defconfig"
          
          # Remove Samsung's "Idiots"
          sed -i 's/CONFIG_SECURITY_DEFEX=y/CONFIG_SECURITY_DEFEX=n/' $CONF
          sed -i 's/CONFIG_SECURITY_SAMSUNG_RKP=y/CONFIG_SECURITY_SAMSUNG_RKP=n/' $CONF
          sed -i 's/CONFIG_KNOX_KAP=y/CONFIG_KNOX_KAP=n/' $CONF
          
          # Enable Virtualization (KVM)
          echo "CONFIG_VIRTUALIZATION=y" >> $CONF
          echo "CONFIG_KVM=y" >> $CONF
          echo "CONFIG_KVM_ARM_HOST=y" >> $CONF
          
          # Enable KSU-Next and SUSFS
          echo "CONFIG_KSU=y" >> $CONF
          echo "CONFIG_KSU_NEXT=y" >> $CONF
          echo "CONFIG_KSU_SUSFS=y" >> $CONF
          echo "CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y" >> $CONF
          
          # Performance/Network Benefits
          echo "CONFIG_TCP_CONG_BBR=y" >> $CONF
          echo "CONFIG_DEFAULT_TCP_CONG=\"bbr\"" >> $CONF

      - name: Cook the Kernel
        run: |
          chmod +x build_kernel.sh
          ./build_kernel.sh
        env:
          KBUILD_BUILD_USER: "Frost"

      - name: Upload Finished Kernel
        uses: actions/upload-artifact@v4
        with:
          name: A32-Nuclear-Kernel-Fixed
          path: output/*.zip
