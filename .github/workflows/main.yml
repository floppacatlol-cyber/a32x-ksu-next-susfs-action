name: Build A32 Surgical Kernel v3
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel
        uses: actions/checkout@v4
        with:
          repository: Yenping0001/android_kernel_samsung_a326b
          ref: a32x-kernel
          fetch-depth: 1

      - name: Install Build Tools
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential flex git libssl-dev libncurses5-dev python3 zip patch

      - name: Setup KernelSU-Next (Legacy)
        run: |
          # We add '|| true' because the setup.sh script often exits with 1 even when successful
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s legacy || true
          
          # Find the core file regardless of symlinks
          KSU_C_FILE=$(find . -name "ksu.c" | grep "KernelSU")
          echo "KSU_CORE=$KSU_C_FILE" >> $GITHUB_ENV
          
          # Disable KPROBES for non-GKI compatibility
          find KernelSU-Next -type f -exec sed -i 's/#ifdef CONFIG_KPROBES/#if defined(CONFIG_KPROBES) \&\& 0/g' {} +

      - name: Prepare SUSFS & FS Patches
        run: |
          git clone -b kernel-4.14 https://gitlab.com/simonpunk/susfs4ksu.git susfs_src
          cp susfs_src/kernel_patches/fs/susfs.c fs/
          cp susfs_src/kernel_patches/include/linux/susfs.h include/linux/
          
          # Inject headers directly into the top of the files to prevent compilation errors
          for file in fs/dcache.c fs/namei.c fs/namespace.c fs/proc/task_mmu.c; do
            sed -i '1i #include <linux/susfs.h>' $file
          done

      - name: Apply SUSFS Kernel Patches
        run: |
          # Use --fuzz=3 to allow for Samsung's source code variations
          patch -p1 --fuzz=3 < susfs_src/kernel_patches/50_add_susfs_in_kernel-4.14.patch || echo "Patching finished with some shifts"
          
          # Bridge KSU-Next to SUSFS using the path found earlier
          sed -i '1i #include <linux/susfs.h>' ${{ env.KSU_CORE }}
          sed -i '/ksu_handle_commit/a \    susfs_set_fa_ksu_status(true);' ${{ env.KSU_CORE }}

      - name: Configure rufnx_defconfig
        run: |
          CONF="arch/arm64/configs/rufnx_defconfig"
          
          # Force Security settings to 'n'
          sed -i 's/CONFIG_SECURITY_DEFEX=y/CONFIG_SECURITY_DEFEX=n/g' $CONF
          sed -i 's/CONFIG_SECURITY_SAMSUNG_RKP=y/CONFIG_SECURITY_SAMSUNG_RKP=n/g' $CONF
          sed -i 's/CONFIG_KNOX_KAP=y/CONFIG_KNOX_KAP=n/g' $CONF
          
          # Append new features
          {
            echo "CONFIG_VIRTUALIZATION=y"
            echo "CONFIG_KVM=y"
            echo "CONFIG_KVM_ARM_HOST=y"
            echo "CONFIG_KSU=y"
            echo "CONFIG_KSU_NEXT=y"
            echo "CONFIG_KSU_SUSFS=y"
            echo "CONFIG_NET_SCH_FQ=y"
            echo "CONFIG_TCP_CONG_BBR=y"
            echo "CONFIG_DEFAULT_TCP_CONG=\"bbr\""
          } >> $CONF
          
          # Ensure the FS Makefile sees susfs.o
          grep -q "susfs.o" fs/Makefile || echo "obj-y += susfs.o" >> fs/Makefile

      - name: Build
        run: |
          chmod +x build_kernel.sh
          ./build_kernel.sh
        env:
          KBUILD_BUILD_USER: "Frost"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: A32-Nuclear-Kernel-v3
          path: output/*.zip
