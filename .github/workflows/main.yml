name: Build A32 Nuclear Kernel (4.14)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel
        uses: actions/checkout@v4
        with:
          repository: Yenping0001/android_kernel_samsung_a326b
          ref: a32x-kernel

      - name: Install Build Tools
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential flex git libssl-dev libncurses5-dev python3 zip patch

      - name: Setup KernelSU-Next (Legacy Branch)
        run: |
          # Use the legacy parameter for 4.14 kernels
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s legacy
          
          # Requirement: Revert the specific KSU commit mentioned in your instructions
          cd KernelSU-Next
          git revert --no-commit 898e9d4f8ca9b2f46b0c6b36b80a872b5b88d899 || echo "Revert failed or already applied"
          
          # Requirement: Disable KPROBES inside KSU-Next files for SUSFS compatibility
          find . -type f -exec sed -i 's/#ifdef CONFIG_KPROBES/#if defined(CONFIG_KPROBES) \&\& 0/g' {} +
          cd ..

      - name: Apply SUSFS Patches (4.14)
        run: |
          git clone -b kernel-4.14 https://gitlab.com/simonpunk/susfs4ksu.git susfs_src
          cp susfs_src/kernel_patches/fs/susfs.c fs/
          cp susfs_src/kernel_patches/include/linux/susfs.h include/linux/
          
          # Patch the kernel core
          patch -p1 < susfs_src/kernel_patches/50_add_susfs_in_kernel-4.14.patch
          
          # Patch KSU-Next to talk to SUSFS
          cd KernelSU-Next
          patch -p1 < ../susfs_src/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch
          cd ..

      - name: Manual Hook Injection (Non-GKI Necessity)
        run: |
          # Injecting hooks manually into the filesystem source code
          # This replaces the need for KPROBES which are broken/unsupported here
          
          # 1. Path Hook (dcache.c)
          sed -i '/extern int ksu_handle_d_path/d' fs/dcache.c
          sed -i 's/char \*d_path(const struct path \*path, char \*buf, int buflen)/extern int ksu_handle_d_path(struct path *, char *, int);\nchar *d_path(const struct path *path, char *buf, int buflen)/' fs/dcache.c
          
          # 2. Stat Hook (stat.c)
          sed -i '/ksu_handle_stat/d' fs/stat.c
          sed -i '/if (error)/i \	extern int ksu_handle_stat(int, const char __user *, int, struct kstat *);\n	ksu_handle_stat(dfd, filename, flags, stat);' fs/stat.c

      - name: Purge Security & Enable KVM/Performance
        run: |
          CONF="arch/arm64/configs/rufnx_defconfig"
          
          # --- Disable Samsung Security "Idiots" ---
          sed -i 's/CONFIG_SECURITY_DEFEX=y/CONFIG_SECURITY_DEFEX=n/' $CONF
          sed -i 's/CONFIG_SECURITY_SAMSUNG_RKP=y/CONFIG_SECURITY_SAMSUNG_RKP=n/' $CONF
          sed -i 's/CONFIG_KNOX_KAP=y/CONFIG_KNOX_KAP=n/' $CONF
          sed -i 's/CONFIG_SEC_RESTRICT_SETUID=y/CONFIG_SEC_RESTRICT_SETUID=n/' $CONF
          sed -i 's/CONFIG_KDP_CRED=y/CONFIG_KDP_CRED=n/' $CONF
          sed -i 's/CONFIG_KDP_NS=y/CONFIG_KDP_NS=n/' $CONF
          echo "CONFIG_TIMA=n" >> $CONF
          echo "CONFIG_UH_RKP=n" >> $CONF
          
          # --- Enable Virtualization (KVM) ---
          echo "CONFIG_VIRTUALIZATION=y" >> $CONF
          echo "CONFIG_KVM=y" >> $CONF
          echo "CONFIG_KVM_ARM_HOST=y" >> $CONF
          echo "CONFIG_KVM_ARM_PMU=y" >> $CONF
          
          # --- Enable KSU-Next & SUSFS ---
          echo "CONFIG_KSU=y" >> $CONF
          echo "CONFIG_KSU_NEXT=y" >> $CONF
          echo "CONFIG_KSU_SUSFS=y" >> $CONF
          echo "CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y" >> $CONF
          
          # --- Performance "Benefits" ---
          echo "CONFIG_TCP_CONG_BBR=y" >> $CONF
          echo "CONFIG_DEFAULT_TCP_CONG=\"bbr\"" >> $CONF
          echo "CONFIG_HZ_300=y" >> $CONF

      - name: Cook the Kernel
        run: |
          chmod +x build_kernel.sh
          ./build_kernel.sh
        env:
          KBUILD_BUILD_USER: "Frost"

      - name: Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: A32-Nuclear-Kernel
          path: output/*.zip
